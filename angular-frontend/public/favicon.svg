<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="110" ry="110" fill="#0a1628"/>
  <rect width="512" height="512" rx="110" ry="110" fill="none" stroke="#0066cc" stroke-width="18" opacity="0.4"/>
  <defs>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <polygon points="300,60 160,290 240,290 212,452 352,222 272,222 300,60"
           fill="url(#bolt)" filter="url(#glow)"/>
</svg>
