{% extends "base.html" %}

{% block title %}{{ t('page_edit_comp') }}{% endblock %}

{% block content %}
<div style="max-width: 700px; margin: 0 auto;">
    <a href="{{ url_for('computer_preferences') }}" class="back-link" style="display: inline-flex; align-items: center; gap: 0.5rem; color: var(--primary); text-decoration: none; margin-bottom: 1rem;">
        <i class="fas fa-arrow-left"></i> {{ t('back_label') }}
    </a>
    <h1 style="margin-bottom: 1.5rem;"><i class="fas fa-edit"></i> {{ t('page_edit_comp') }}</h1>

    <div class="card">
        <form method="post">
            <div class="form-group">
                <label for="name"><i class="fas fa-desktop"></i> {{ t('comp_name_label') }}</label>
                <input type="text" id="name" name="name" value="{{ computer.name }}" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-ethernet"></i> {{ t('comp_mac_label') }}</label>
                <input type="text" value="{{ computer.mac_address }}" disabled style="background: #f5f5f5;">
                <small style="color: #999;">{{ t('mac_no_change') }}</small>
            </div>

            <div class="form-group">
                <label for="ip_address"><i class="fas fa-network-wired"></i> {{ t('comp_ip_label') }}</label>
                <input type="text" id="ip_address" name="ip_address" value="{{ computer.ip_address or '' }}">
            </div>

            <div class="form-group">
                <label for="description"><i class="fas fa-comment"></i> {{ t('comp_desc_label') }}</label>
                <textarea id="description" name="description" rows="3">{{ computer.description or '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="os_type"><i class="fas fa-laptop"></i> {{ t('comp_os_label') }}</label>
                <select id="os_type" name="os_type" required>
                    <option value="linux" {% if computer.os_type == 'linux' %}selected{% endif %}>Linux</option>
                    <option value="windows" {% if computer.os_type == 'windows' %}selected{% endif %}>Windows</option>
                    <option value="unknown" {% if computer.os_type == 'unknown' %}selected{% endif %}>{{ t('comp_os_unknown_opt') }}</option>
                </select>
            </div>

            <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--border);">

            <div class="form-group">
                <label for="ssh_host"><i class="fas fa-server"></i> {{ t('ssh_host_label') }}</label>
                <input type="text" id="ssh_host" name="ssh_host" value="{{ computer.ssh_host or '' }}" placeholder="npr. 192.168.1.100">
            </div>

            <div class="form-group">
                <label for="ssh_port"><i class="fas fa-ethernet"></i> {{ t('ssh_port_label') }}</label>
                <input type="number" id="ssh_port" name="ssh_port" value="{{ computer.ssh_port or 22 }}" min="1" max="65535">
            </div>

            <div class="form-group">
                <label for="ssh_username"><i class="fas fa-user"></i> {{ t('ssh_user_label') }}</label>
                <input type="text" id="ssh_username" name="ssh_username" value="{{ computer.ssh_username or '' }}">
            </div>

            <div class="form-group">
                <label for="ssh_password"><i class="fas fa-key"></i> {{ t('ssh_pass_label') }}</label>
                <input type="password" id="ssh_password" name="ssh_password" value="" placeholder="{{ t('ssh_keep_existing') }}">
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    <i class="fas fa-save"></i> {{ t('btn_save_changes') }}
                </button>
                <a href="{{ url_for('computer_preferences') }}" class="btn" style="flex: 1; background: #999; color: white; text-align: center;">
                    {{ t('btn_cancel') }}
                </a>
            </div>
        </form>
    </div>
</div>


{% endblock %}
