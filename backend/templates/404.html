{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div style="text-align: center; padding: 3rem;">
    <h1 style="font-size: 3rem; margin-bottom: 1rem;">404</h1>
    <p style="font-size: 1.3rem; margin-bottom: 2rem;">Page Not Found</p>
    <p style="color: #999; margin-bottom: 2rem;">The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Back to Dashboard</a>
</div>
{% endblock %}
