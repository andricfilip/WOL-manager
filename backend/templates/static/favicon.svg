<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a8e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#grad)"/>
  <g fill="white">
    <!-- Computer Monitor -->
    <rect x="120" y="140" width="272" height="200" rx="12" stroke="white" stroke-width="12" fill="none"/>
    <rect x="220" y="340" width="72" height="60" rx="6"/>
    <rect x="180" y="390" width="152" height="16" rx="8"/>
    
    <!-- Power Symbol -->
    <circle cx="256" cy="240" r="50" stroke="white" stroke-width="14" fill="none" stroke-dasharray="220 90" stroke-dashoffset="45"/>
    <line x1="256" y1="190" x2="256" y2="240" stroke="white" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
