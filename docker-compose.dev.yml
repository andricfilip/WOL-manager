# Development Docker Compose - Sa live reload (volumes)
# Koristi: docker compose -f docker-compose.dev.yml up -d --build

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: computerrunner_db_dev
    environment:
      POSTGRES_DB: wol_db
      POSTGRES_USER: wol_user
      POSTGRES_PASSWORD: wol_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wol_user -d wol_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wol-network-dev

  # Backend Flask application - DEV MODE sa volumes!
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: computerrunner_backend_dev
    ports:
      - "5000:5000"  # Expose za debugging
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - SECRET_KEY=dev-secret-key-not-for-production
      - ENCRYPTION_KEY=ofOMSyR4sudprpLJ_GOGaS0Y3c1rz36051VUOsL0fLk=
      - DATABASE_URL=postgresql://wol_user:wol_password@postgres:5432/wol_db
      - SESSION_COOKIE_SECURE=false
      - SESSION_COOKIE_HTTPONLY=true
      - SESSION_COOKIE_SAMESITE=Lax
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # 🔥 VOLUMES za live changes!
    volumes:
      - ./backend:/app:ro  # Mount celokupan backend folder (read-only za sigurnost)
      - /app/__pycache__   # Exclude cache
    networks:
      - wol-network-dev
    command: python -m flask run --host=0.0.0.0 --reload

  # Nginx frontend - DEV MODE sa volumes!
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: computerrunner_frontend_dev
    environment:
      - BACKEND_HOST=backend
    ports:
      - "13223:80"  # Custom port za dev
      - "8443:443"
    restart: unless-stopped
    depends_on:
      - backend
    # 🔥 VOLUMES za live changes!
    volumes:
      - ./frontend:/usr/share/nginx/html:ro  # Mount frontend files
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./frontend/ssl:/etc/nginx/ssl:ro
    networks:
      - wol-network-dev

networks:
  wol-network-dev:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
